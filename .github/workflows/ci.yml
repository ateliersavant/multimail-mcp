name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run check:egress
      - run: npm run check:tenants -- fixtures/tenants.example.json
      - run: npm run test:mutation
      - name: No real domains or addresses in the tree
        env:
          # The denylist names real companies, so it lives in an encrypted repository secret, never in the repo.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: node scripts/check-forbidden.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
