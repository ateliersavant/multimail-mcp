name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run check:egress
      - run: npm run check:tenants -- fixtures/tenants.example.json
      - run: npm run test:mutation
      - name: No real domains or addresses in the tree
        env:
          # The denylist names real companies, so it lives in an encrypted repository secret, never in the repo.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: node scripts/check-forbidden.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Full-history scan with a pinned, checksum-verified gitleaks binary. (gitleaks-action derives its commit range
      # from the push event and fails on a branch's first push, where the range starts before the root commit.)
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's# gitleaks_# gitleaks.tar.gz #; s#gitleaks.tar.gz .*#gitleaks.tar.gz#' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 2 .
